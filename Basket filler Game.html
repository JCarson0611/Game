<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Catcher: Blaster Edition</title>
    <style>
        body { 
            margin: 0; background-color: #111; display: flex; 
            justify-content: center; align-items: center; height: 100vh; 
            color: white; font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #game-container { position: relative; border: 6px solid #444; background: #000; box-shadow: 0 0 50px rgba(0,0,0,0.7); }
        #gameCanvas { display: block; cursor: none; transition: background 1.5s; background: #1a2a6c; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; z-index: 100;
        }
        
        .menu-card { background: #222; padding: 25px; border-radius: 15px; border: 2px solid #ffcc00; max-width: 85%; }
        
        .powerup-list {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            text-align: left; margin: 15px 0; font-size: 13px;
        }
        .p-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 2px; border: 1px solid #fff; }

        button { 
            padding: 12px 25px; font-size: 18px; cursor: pointer; 
            background: #ffcc00; border: none; font-weight: bold;
            border-radius: 5px; transition: 0.2s; margin: 5px; font-family: inherit;
        }
        button:hover { background: #fff; transform: scale(1.05); }

        .hud {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: space-around;
            font-weight: 900; text-shadow: 2px 2px 0px #000; z-index: 10;
            pointer-events: none; letter-spacing: 1px;
        }

        #weather-warning {
            position: absolute; bottom: 100px; width: 100%;
            text-align: center; color: #ff3333; font-weight: 900;
            font-size: 22px; display: none; 
            animation: blink 0.4s infinite;
            text-shadow: 0px 0px 10px rgba(0,0,0,0.8), 2px 2px 2px #000;
            letter-spacing: 2px; z-index: 20;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #level-up-flash, #resume-countdown {
            position: absolute; top: 40%; width: 100%; text-align: center;
            font-size: 80px; color: #ffcc00; font-weight: bold; 
            text-shadow: 4px 4px 0px #000; display: none; z-index: 110;
        }

        table { width: 100%; margin-top: 10px; border-collapse: collapse; background: #333; font-size: 13px;}
        th { border-bottom: 2px solid #ffcc00; padding: 8px; }
        td { padding: 5px; border-bottom: 1px solid #555; text-align: center;}
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div style="color: #ffcc00;">LEVEL: <span id="level">1</span></div>
        <div>LIVES: <span id="lives">4</span></div>
    </div>

    <div id="weather-warning">⚠️ WEATHER ALERT</div>
    <div id="level-up-flash">LEVEL 2</div>
    <div id="resume-countdown">3</div>

    <div id="start-menu" class="overlay">
        <div class="menu-card">
            <h1 style="color:#ffcc00; margin:0;">SKY CATCHER</h1>
            <div class="powerup-list">
                <div class="p-item"><div class="dot" style="background:#fff"></div> Points (+10)</div>
                <div class="p-item"><div class="dot" style="background:#00ffff"></div> BLASTER (Auto-Fire)</div>
                <div class="p-item"><div class="dot" style="background:#ff00ff"></div> God Mode</div>
                <div class="p-item"><div class="dot" style="background:#ff3333"></div> BOMB (Avoid!)</div>
                <div class="p-item"><div class="dot" style="background:#00ff00"></div> Extra Life</div>
            </div>
            <button onclick="startGame()">START GAME</button>
        </div>
    </div>

    <div id="pause-menu" class="overlay" style="display:none;">
        <h1 style="font-size: 48px;">PAUSED</h1>
        <button onclick="startResumeCountdown()">RESUME GAME</button>
    </div>

    <div id="game-over" class="overlay" style="display:none;">
        <h1 style="color:#ff4444; margin: 5px;">GAME OVER</h1>
        <img id="final-screenshot" style="width:180px; border:2px solid #fff; margin-bottom:10px;">
        <p>Final Score: <span id="final-score" style="color:#ffcc00; font-weight:bold;">0</span></p>
        <div id="high-score-entry">
            <input type="text" id="player-name" placeholder="NAME" maxlength="10" style="padding:10px; text-align:center; border-radius:5px; border:none; margin-bottom:10px;">
            <br><button onclick="saveScore()">SUBMIT SCORE</button>
        </div>
        <div id="post-save-options" style="display:none; width: 85%;">
            <button id="download-btn" onclick="downloadImage()" style="background:#1877F2; color:white;">DOWNLOAD PNG</button>
            <button onclick="location.reload()">PLAY AGAIN</button>
            <table id="leaderboard">
                <thead><tr><th>RANK</th><th>NAME</th><th>SCORE</th></tr></thead>
                <tbody id="score-body"></tbody>
            </table>
        </div>
    </div>

    <canvas id="gameCanvas" width="600" height="700"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    let score = 0, lives = 4, level = 1, baseSpeed = 2.5;
    let gameActive = false, isPaused = false, gameOver = false, inCountdown = false, bombLock = false;
    let spawnTimer = null, explosionAnim = 0;
    
    // Power-up States
    let godMode = false, godTimeRemaining = 0, jackpot = false, rainbowHue = 0;
    let blasterMode = false, blasterTimeRemaining = 0, lastShotTime = 0;
    
    const basket = { x: 250, targetX: 250, y: 640, w: 100, h: 20, color: '#ffcc00', lerp: 0.22 };
    let items = [];
    let lasers = [];

    const WEATHER_TYPES = ['SUN', 'RAIN', 'SNOW', 'FOG'];
    let currentWeather = 'SUN', nextWeather = 'RAIN', weatherParticles = [], lightningFlash = 0;

    const TYPES = {
        POINT: { color: '#fff' },
        BOMB:  { color: '#ff3333', label: '💣' },
        GOD:   { color: '#ff00ff', label: 'GOD' },
        WIDE:  { color: '#00ffff', label: 'WIDE' },
        JACK:  { color: '#ffff00', label: '$$$' },
        LIFE:  { color: '#00ff00', label: '+1' },
        GUN:   { color: '#00ffff', label: 'GUN' }
    };

    const SHAPES = ['SQUARE', 'CIRCLE', 'TRIANGLE', 'HEXAGON'];

    function startGame() {
        if(gameActive) return;
        document.getElementById('start-menu').style.display = 'none';
        score = 0; lives = 4; level = 1; baseSpeed = 2.5;
        items = []; lasers = []; godMode = false; blasterMode = false;
        document.getElementById('score').innerText = score;
        document.getElementById('lives').innerText = lives;
        document.getElementById('level').innerText = level;
        gameActive = true;
        prepareNextWeather();
        updateWeatherSystem();
        spawnItem();
        requestAnimationFrame(update);
    }

    function spawnItem() {
        if (gameOver || !gameActive || bombLock) return;
        if (!isPaused && !inCountdown) {
            const rand = Math.random();
            let type = TYPES.POINT;
            if (rand < 0.008) type = TYPES.BOMB; 
            else if (rand < 0.013) type = TYPES.GOD;
            else if (rand < 0.020) type = TYPES.GUN; // Blaster rarity
            else if (rand < 0.030) type = TYPES.WIDE;
            else if (rand < 0.045) type = TYPES.JACK;
            else if (rand < 0.050) type = TYPES.LIFE;

            items.push({
                x: Math.random() * (canvas.width - 30),
                y: -50,
                size: (type === TYPES.POINT) ? 18 : 28,
                speed: baseSpeed + (Math.random() * 1.5),
                type: type,
                shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.1
            });
        }
        spawnTimer = setTimeout(spawnItem, Math.max(300, 1100 - (level * 70)));
    }

    function triggerBomb() {
        lives--;
        document.getElementById('lives').innerText = lives;
        explosionAnim = 20;
        items = [];
        lasers = [];
        bombLock = true;
        if (lives <= 0) endGame();
        else {
            setTimeout(() => { bombLock = false; spawnItem(); }, 1000);
        }
    }

    function update() {
        if (!gameActive || gameOver) return;
        if (isPaused || inCountdown) { draw(); requestAnimationFrame(update); return; }

        const now = Date.now();

        // Power-up Timers
        if (godMode) {
            godTimeRemaining -= 16.67;
            rainbowHue = (rainbowHue + 5) % 360;
            if (godTimeRemaining <= 0) godMode = false;
        }
        if (blasterMode) {
            blasterTimeRemaining -= 16.67;
            if (blasterTimeRemaining <= 0) blasterMode = false;
            
            // Auto-firing logic
            if (now - lastShotTime > 150) {
                lasers.push({ x: basket.x + basket.w / 2 - 2, y: basket.y, speed: 10 });
                lastShotTime = now;
            }
        }

        // Lasers Logic
        lasers.forEach((laser, lIdx) => {
            laser.y -= laser.speed;
            if (laser.y < 0) lasers.splice(lIdx, 1);

            items.forEach((item, iIdx) => {
                if (laser.x < item.x + item.size && laser.x + 4 > item.x &&
                    laser.y < item.y + item.size && laser.y + 15 > item.y) {
                    
                    if (item.type === TYPES.BOMB) {
                        triggerBomb();
                    } else {
                        applyEffect(item.type); // Score points
                        items.splice(iIdx, 1);
                    }
                    lasers.splice(lIdx, 1);
                }
            });
        });

        let scoreToNext = 250 - (score % 250);
        let warn = document.getElementById('weather-warning');
        if (scoreToNext <= 75 && score > 0) {
            warn.style.display = 'block';
            warn.innerHTML = `<span style="font-size: 14px;">Incoming:</span><br>⚠️ ${nextWeather} ALERT`;
        } else { warn.style.display = 'none'; }

        if (Math.floor(score / 250) + 1 > level) {
            level++; baseSpeed += 0.4;
            document.getElementById('level').innerText = level;
            updateWeatherSystem();
            flashLevelUp();
        }

        // Movement Clamping
        let nextX = basket.x + (basket.targetX - basket.x) * basket.lerp;
        basket.x = Math.max(0, Math.min(canvas.width - basket.w, nextX));

        if (!bombLock) {
            items.forEach((item, index) => {
                item.y += item.speed;
                item.rotation += item.rotSpeed;
                if (item.y + item.size > basket.y && item.x < basket.x + basket.w && item.x + item.size > basket.x) {
                    if (item.type === TYPES.BOMB) triggerBomb();
                    else { applyEffect(item.type); items.splice(index, 1); }
                } else if (item.y > canvas.height) {
                    if (!godMode && item.type === TYPES.POINT) { lives--; document.getElementById('lives').innerText = lives; }
                    items.splice(index, 1);
                    if (lives <= 0) endGame();
                }
            });
        }

        weatherParticles.forEach(p => {
            p.y += p.speed;
            if (currentWeather === 'SNOW') p.x += p.drift;
            if (p.y > canvas.height) p.y = -50;
        });

        if (currentWeather === 'RAIN' && Math.random() < 0.006) lightningFlash = 7;
        if (lightningFlash > 0) lightningFlash--;
        if (explosionAnim > 0) explosionAnim--;

        draw();
        requestAnimationFrame(update);
    }

    function applyEffect(type) {
        if (type === TYPES.POINT) score += jackpot ? 50 : 10;
        else if (type === TYPES.LIFE) lives++;
        else if (type === TYPES.WIDE) { basket.w = 200; setTimeout(() => { basket.w = 100; }, 10000); }
        else if (type === TYPES.GOD) { godMode = true; godTimeRemaining = 8000; }
        else if (type === TYPES.GUN) { blasterMode = true; blasterTimeRemaining = 8000; }
        else if (type === TYPES.JACK) { jackpot = true; setTimeout(() => jackpot = false, 10000); }
        document.getElementById('score').innerText = score;
        document.getElementById('lives').innerText = lives;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Weather
        weatherParticles.forEach(p => {
            ctx.beginPath();
            if (currentWeather === 'RAIN') { ctx.strokeStyle = 'rgba(174, 194, 224, 0.4)'; ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + p.len); ctx.stroke(); }
            else if (currentWeather === 'SNOW') { ctx.fillStyle = 'white'; ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); }
            else if (currentWeather === 'FOG') { ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`; ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); }
        });
        
        // Lasers
        lasers.forEach(laser => {
            ctx.fillStyle = "#00ffff";
            ctx.shadowBlur = 10; ctx.shadowColor = "#00ffff";
            ctx.fillRect(laser.x, laser.y, 4, 15);
            ctx.shadowBlur = 0;
        });

        if (lightningFlash > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${lightningFlash/7})`; ctx.fillRect(0,0,canvas.width, canvas.height); }
        if (explosionAnim > 0) { ctx.fillStyle = `rgba(255, 100, 0, ${explosionAnim/20})`; ctx.beginPath(); ctx.arc(basket.x + basket.w/2, basket.y, 100 + (20-explosionAnim)*5, 0, Math.PI*2); ctx.fill(); }

        // Basket & Timers
        if (godMode) {
            ctx.fillStyle = `hsl(${rainbowHue}, 100%, 60%)`;
            ctx.shadowBlur = 15; ctx.shadowColor = `hsl(${rainbowHue}, 100%, 60%)`;
            ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
            ctx.fillText(`GOD: ${(godTimeRemaining/1000).toFixed(1)}s`, basket.x + basket.w/2, basket.y - 35);
        } else { ctx.fillStyle = basket.color; }

        if (blasterMode) {
            // Draw Cannon
            ctx.fillStyle = "#555";
            ctx.fillRect(basket.x + basket.w/2 - 10, basket.y - 15, 20, 15);
            ctx.fillStyle = "#00ffff";
            ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
            ctx.fillText(`GUN: ${(blasterTimeRemaining/1000).toFixed(1)}s`, basket.x + basket.w/2, basket.y - (godMode ? 55 : 35));
            ctx.fillStyle = godMode ? `hsl(${rainbowHue}, 100%, 60%)` : basket.color;
        }

        ctx.fillRect(basket.x, basket.y, basket.w, basket.h);
        ctx.shadowBlur = 0;

        // Items
        items.forEach(item => {
            ctx.save();
            ctx.translate(item.x + item.size/2, item.y + item.size/2);
            ctx.rotate(item.rotation); ctx.fillStyle = item.type.color; ctx.beginPath();
            let s = item.size / 2;
            if(item.shape === 'SQUARE') ctx.rect(-s, -s, item.size, item.size);
            else if(item.shape === 'CIRCLE') ctx.arc(0, 0, s, 0, Math.PI * 2);
            else if(item.shape === 'TRIANGLE') { ctx.moveTo(0, -s); ctx.lineTo(s, s); ctx.lineTo(-s, s); }
            else { for (let i = 0; i < 6; i++) ctx.lineTo(s * Math.cos(i * Math.PI / 3), s * Math.sin(i * Math.PI / 3)); }
            ctx.closePath(); ctx.fill();
            if(item.type.label) { ctx.rotate(-item.rotation); ctx.fillStyle = "black"; ctx.font = "900 10px Arial"; ctx.textAlign = "center"; ctx.fillText(item.type.label, 0, 4); }
            ctx.restore();
        });
    }

    // Standard helpers (Weather, Pause, Save, etc)
    function prepareNextWeather() { let picked; do { picked = WEATHER_TYPES[Math.floor(Math.random() * WEATHER_TYPES.length)]; } while (picked === currentWeather); nextWeather = picked; }
    function updateWeatherSystem() {
        currentWeather = nextWeather; prepareNextWeather(); weatherParticles = [];
        if (currentWeather === 'SUN') canvas.style.background = "linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d)";
        else if (currentWeather === 'RAIN') { canvas.style.background = "linear-gradient(to bottom, #203a43, #2c5364, #000000)"; for (let i = 0; i < 100; i++) weatherParticles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: 14, len: 15 }); }
        else if (currentWeather === 'SNOW') { canvas.style.background = "linear-gradient(to bottom, #42275a, #734b6d)"; for (let i = 0; i < 80; i++) weatherParticles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: 3, size: 2.5, drift: Math.random() - 0.5 }); }
        else if (currentWeather === 'FOG') { canvas.style.background = "linear-gradient(to bottom, #757f9a, #d7dde8)"; for (let i = 0; i < 15; i++) weatherParticles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: 0.6, size: 70, opacity: 0.12 }); }
    }
    function startResumeCountdown() { document.getElementById('pause-menu').style.display = 'none'; inCountdown = true; let count = 3; const countEl = document.getElementById('resume-countdown'); countEl.innerText = count; countEl.style.display = 'block'; const timer = setInterval(() => { count--; if (count <= 0) { clearInterval(timer); countEl.style.display = 'none'; isPaused = false; inCountdown = false; } else { countEl.innerText = count; } }, 1000); }
    function togglePause() { if (gameOver || !gameActive || inCountdown) return; if (!isPaused) { isPaused = true; document.getElementById('pause-menu').style.display = 'flex'; } else { startResumeCountdown(); } }
    function flashLevelUp() { const el = document.getElementById('level-up-flash'); el.innerText = `LEVEL ${level}`; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 1800); }
    function endGame() { gameOver = true; gameActive = false; clearTimeout(spawnTimer); const temp = document.createElement("canvas"); temp.width = 400; temp.height = 400; const tCtx = temp.getContext("2d"); tCtx.fillStyle = "#1a2a6c"; tCtx.fillRect(0,0,400,400); tCtx.fillStyle = "#ffcc00"; tCtx.textAlign = "center"; tCtx.font = "bold 24px Arial"; tCtx.fillText("FINAL SCORE", 200, 140); tCtx.fillStyle = "white"; tCtx.font = "bold 90px Arial"; tCtx.fillText(score, 200, 260); document.getElementById("final-screenshot").src = temp.toDataURL(); document.getElementById('game-over').style.display = 'flex'; document.getElementById('final-score').innerText = score; }
    function saveScore() { const name = document.getElementById("player-name").value.toUpperCase() || "PLAYER"; let hs = JSON.parse(localStorage.getItem("catchScores") || "[]"); hs.push({ name, score }); hs.sort((a, b) => b.score - a.score); hs = hs.slice(0, 5); localStorage.setItem("catchScores", JSON.stringify(hs)); document.getElementById("high-score-entry").style.display = "none"; document.getElementById("post-save-options").style.display = "block"; document.getElementById("score-body").innerHTML = hs.map((s, i) => `<tr><td>#${i+1}</td><td>${s.name}</td><td>${s.score}</td></tr>`).join(""); }
    function downloadImage() { const link = document.createElement('a'); link.href = document.getElementById("final-screenshot").src; link.download = `Score_${score}.png`; link.click(); }
    
    window.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        basket.targetX = e.clientX - rect.left - basket.w / 2;
    });
    window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'p' || e.key === 'Escape') togglePause(); });
</script>
</body>
</html>
